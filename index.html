<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Umbra Royale</title>
    <style>
      header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 10px 20px;
      }

      .links {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      h1 {
        color: rgb(0, 0, 0);
        margin: 0;
        white-space: nowrap;
        font-size: 70px;
        font-family: "cursive";
      }

      nav {
        background-color: #120417c7;
        width: fit-content;
        min-width: 250px;
        min-height: 55px;
        padding: 8px 15px;
        border: 3px solid #000000;
        border-radius: 40px;
        flex-wrap: wrap;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px 20px;
      }

      main {
        background-color: hsla(263, 100%, 6%, 0.882);
        width: 800px;
        height: fit-content;
        align-items: center;
        justify-content: center;
        margin: 20px auto;
        padding: 20px;
        border: 4px solid hsla(0, 0%, 0%, 0.882);
        border-radius: 20px;
      }

      main h2 {
        color: white;
        font-family: "Palatino";
        text-align: center;
        font-size: 45px;
        margin-top: 0;
        margin-bottom:40px;
      }

      main p {
        color: white;
        font-family: "Palatino";
        text-align: center;
        font-size: 20px;
        font-weight: bold;
      }

      .zuffalsgen {
        background-color: rgba(18, 4, 23, 0.7);
        color: rgb(255, 255, 255, 1);
        font-weight: 600;
        width: 140px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        padding: 0px 15px;
        border-radius: 20px;
        transition: background-color 0.3;
      }

        .zuffalsgen:hover {
          background-color: rgba(18, 4, 23, 1);
        }

      body {
        background-image: url("osu_wallpaper.png");
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-position: center;
        margin: 0;
        min-height: 100vh;
      }

      @media (max-width: 700px) {
        header {
          grid-template-columns: 1fr;
          justify-items: center;
        }

        nav {
          grid-column: 1;
        }

        body {
          background-attachment: scroll;
        }

        h1 {
          font-size: 36px;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="links">
        <a href="index.html">
          <img src="web-logo.png" alt="osu! Logo" width="100">
        </a>
        <h1>Umbra Royale</h1>
      </div>
      <nav>
        <a href="zufallsgenerator.html" class="zuffalsgen">Zufallsgenerator</a>
      </nav>
    </header>
    <main>
      <h2>Willkommen bei Umbra Royale</h2>
      <p>osu! ist ein kostenloses Rhythmusspiel:
        Du triffst Kreise, folgst Schiebereglern oder drückst Tasten im Takt der Musik. Es gibt mehrere Modi, darunter Trommeln (taiko), Früchte fangen (catch) und Tasten-Gameplay (mania).</p>
    </main>
  </body>
</html>
