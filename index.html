<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home - Umbra Royale</title>
    <style>
      header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 10px 20px;
      }

      .links {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      h1 {
        color: rgb(0, 0, 0);
        margin: 0;
        white-space: nowrap;
        font-size: 70px;
        font-family: "cursive";
      }

      nav {
        background-color: #120417c7;
        width: 100%;
        max-width: 400px;
        height: 55px;
        border-radius: 40px;
        flex-wrap: wrap;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }

      .site2 {
        background-color: #ffffff;
        color: rgb(0, 0, 0);
        font-weight: 500;
        width: 45px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        padding: 0px 15px;
        border-radius: 20px;
      }

      body {
        background-image: url("osu_wallpaper.png");
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-position: center;
        margin: 0;
        min-height: 100vh;
      }

      @media (max-width: 700px) {
        header {
          grid-template-columns: 1fr;
          justify-items: center;
        }

        nav {
          grid-column: 1;
        }

        body {
          background-attachment: scroll;
        }

        h1 {
          font-size: 36px;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="links">
        <a href="index.html">
          <img src="web-logo.png" alt="osu! Logo" width="100">
        </a>
        <h1>Umbra Royale</h1>
      </div>
      <nav>
        <a href="site2.html" class="site2">Site 2</a>
      </nav>
    </header>
  </body>
</html>
